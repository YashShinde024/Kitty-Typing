<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Primary Meta Tags -->

  <meta name="keywords" content="typing test, typing practice, wpm test, speed typing, kitty typing, online typing test, typing speed checker" />
  <meta name="author" content="Yash Shinde" />

  <!-- Open Graph / Social Preview -->
  <meta property="og:title" content="Kitty Typing – Online Typing Speed Test & Practice" />
  <meta property="og:description" content="Take typing speed tests, track WPM and accuracy, and improve your typing skills with Kitty Typing." />
  <meta property="og:type" content="website" />

  <!-- Google Site Verification -->

  <!-- Optional: Twitter Card (nice for sharing) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Kitty Typing – Online Typing Speed Test & Practice" />
  <meta name="twitter:description" content="Improve your typing speed and accuracy with Kitty Typing. Take typing tests, track WPM, and monitor your progress." />
  <meta name="twitter:image" content="https://kitty-typing.onrender.com/assets/images/logo.jpg />

  <!-- FIXED CSS PATH -->
  <link rel="stylesheet" href="styles/style.css" />

  <!-- Structured Data (SEO boost, no visual change) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Kitty Typing",
    "url": "https://kitty-typing.onrender.com/",
    "description": "Kitty Typing is an online typing speed test and practice website to improve WPM and accuracy.",
    "publisher": {
      "@type": "Organization",
      "name": "Kitty Typing"
    },
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://kitty-typing.onrender.com/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <style>
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg: #020617;
    --accent: #6366f1;
    --accent-strong: #a855f7;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --border: rgba(148, 163, 184, 0.5);
  }

  html,
  body {
    height: 100%;
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at top, #1d2440 0, transparent 55%),
      radial-gradient(circle at bottom, #020617 0, #000 60%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    overflow: hidden;
  }

  /* Visually hidden but accessible (for SEO + screen readers) */
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }

  .bg-orbit {
    position: fixed;
    top: -160px;
    right: -160px;
    width: 330px;
    height: 330px;
    background: conic-gradient(
      from 120deg,
      rgba(99, 102, 241, 0.25),
      rgba(168, 85, 247, 0.35),
      rgba(59, 130, 246, 0.28),
      rgba(99, 102, 241, 0.25)
    );
    filter: blur(42px);
    z-index: -1;
    animation: spin 28s linear infinite;
  }

  .bg-orbit.two {
    top: auto;
    bottom: -160px;
    left: -160px;
    right: auto;
    width: 360px;
    height: 360px;
    animation-direction: reverse;
    opacity: 0.7;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .wrapper {
    width: 100%;
    max-width: 380px;
    opacity: 0;
    transform: translateY(12px);
    animation: fade 0.65s ease forwards;
  }

  @keyframes fade {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ---------- LOGO AREA ---------- */
  .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }

  .brand-logo {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow:
      0 0 18px rgba(99, 102, 241, 0.9),
      0 0 32px rgba(168, 85, 247, 0.95);
  }

  .logo-title {
    text-transform: uppercase;
    font-size: 0.9rem;
    font-weight: 600;
  }

  /* ---------- CARD & FORM ---------- */
  .card {
    background: rgba(15, 23, 42, 0.96);
    border: 1px solid var(--border);
    border-radius: 1.4rem;
    padding: 1.5rem 1.3rem;
    backdrop-filter: blur(18px);
    box-shadow: 0 22px 48px rgba(15, 23, 42, 0.92);
  }

  .card h2 {
    text-align: center;
    font-size: 1.45rem;
    margin-bottom: 0.35rem;
  }

  .card p {
    text-align: center;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 1.1rem;
  }

  .form {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.28rem;
  }

  .field label {
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(229, 231, 235, 0.85);
  }

  .field input {
    padding: 0.65rem 0.85rem;
    border-radius: 0.9rem;
    border: 1px solid rgba(148, 163, 184, 0.75);
    background: #0f172a;
    color: #eef2ff;
    font-size: 0.9rem;
    outline: none;
    transition: 0.18s;
  }

  .field input:focus {
    border-color: var(--accent);
    box-shadow:
      0 0 0 1px var(--accent),
      0 0 25px rgba(99, 102, 241, 0.4);
  }

  /* ---------- ROW (remember + forgot) ---------- */
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .row label {
    display: flex;
    align-items: center;
    gap: 0.38rem;
    cursor: pointer;
  }

  .row input[type="checkbox"] {
    width: 0.9rem;
    height: 0.9rem;
    border-radius: 0.25rem;
    appearance: none;
    border: 1px solid #94a3b8;
    background: #0f172a;
    position: relative;
  }

  .row input[type="checkbox"]:checked {
    background: linear-gradient(135deg, #22c55e, var(--accent));
    border: none;
  }

  .row input[type="checkbox"]:checked::after {
    content: "✓";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.62rem;
    color: #fff;
  }

  /* ---------- BUTTONS ---------- */
  .btn {
    margin-top: 0.25rem;
    background: linear-gradient(
      135deg,
      #22c55e,
      var(--accent),
      var(--accent-strong)
    );
    padding: 0.73rem;
    border-radius: 2rem;
    border: none;
    width: 100%;
    color: #fff;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: 0.18s;
  }

  .btn:hover {
    transform: scale(1.02);
    filter: brightness(1.06);
  }

  .btn:active {
    transform: scale(0.97);
  }

  .google-btn {
    margin-top: 0.6rem;
    width: 100%;
    border-radius: 2rem;
    border: 1px solid var(--border);
    background: #0f172a;
    padding: 0.7rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    font-size: 0.9rem;
    color: #fff;
    cursor: pointer;
    transition: 0.18s;
  }

  .google-btn:hover {
    background: #1e293b;
    transform: scale(1.02);
  }

  .google-btn img {
    width: 18px;
    height: 18px;
  }

  /* ---------- BOTTOM TEXT ---------- */
  .bottom {
    margin-top: 0.9rem;
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .bottom a {
    text-decoration: none;
    color: #a5b4fc;
  }

/* ===== COMMON FOOTER STYLES (glow, colors) ===== */
.footer-inner {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.55rem 1.9rem;
  border-radius: 999px;
  border: 1px solid rgba(148, 163, 184, 0.6);
  background: radial-gradient(circle at top, rgba(15, 23, 42, 0.98), #020617);
  box-shadow:
    0 0 0 1px rgba(15, 23, 42, 1),
    0 0 26px rgba(79, 70, 229, 0.85),
    0 0 52px rgba(30, 64, 175, 0.9);
}

.footer-label {
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-size: 0.7rem;
  color: rgba(148, 163, 184, 0.85);
}

.creator-link {
  color: #e5e7eb;
  font-weight: 500;
  text-decoration: none;
  transition: color 0.18s ease, text-shadow 0.18s ease;
}

.creator-link:hover {
  color: #a5b4fc;
  text-shadow: 0 0 12px rgba(129, 140, 248, 0.9);
}

.dot {
  color: #6b7280;
  font-weight: 600;
}

/* ===== DEFAULT: fixed footer (typing page etc.) ===== */
.footer {
  position: fixed;
  left: 50%;
  bottom: 32px;
  transform: translateX(-50%);
  text-align: center;
  font-size: 0.78rem;
  z-index: 20;
}

/* ===== LOGIN PAGE: NO FIXED, NO OVERLAP ===== */
.login-page .footer {
  position: static;
  transform: none;
  margin: 3rem auto 2rem;   /* just like screenshot 1 */
  display: flex;
  justify-content: center;
}

  </style>
</head>
<body class="login-page">

  <div class="bg-orbit"></div>
  <div class="bg-orbit two"></div>

  <!-- SEO + Accessibility: hidden main heading, no visual change -->
  <h1 class="visually-hidden">
    Kitty Typing – Online Typing Speed Test & Practice Platform
  </h1>

  <div class="wrapper">
    <!-- Logo block fixed & centered -->
    <div class="logo">
      <!-- FIXED LOGO PATH -->
      <img src="assets/images/logo.jpg" alt="Kitty Typing Logo" class="brand-logo" />
      <span class="logo-title">Kitty Typing Test</span>
    </div>

    <div class="card">
      <h2>Welcome Back</h2>
      <p>Login to continue</p>

      <form class="form" id="login-form">
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <div class="row">
          <label>
            <input type="checkbox" id="remember">
            Remember me
          </label>
          <a href="#" id="forgot-password" style="color:#a5b4fc;">Forgot?</a>
        </div>

        <button class="btn" type="submit">Login</button>

        <button class="google-btn" id="google-login" type="button">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
          Continue with Google
        </button>
      </form>

      <div class="bottom">
        New here? <a href="registration.html">Create Account</a>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-inner">
        <span class="footer-label">Created by</span>
        <a href="https://www.linkedin.com/in/yash-shinde-393159309" target="_blank" class="creator-link">Yash</a>
        <span class="dot">•</span>
        <a href="https://www.linkedin.com/in/om-dumbre-075345372" target="_blank" class="creator-link">Om</a>
        <span class="dot">•</span>
        <a href="https://www.linkedin.com/in/ayush-valanju-3a3632341" target="_blank" class="creator-link">Ayush</a>
      </div>
    </footer>

  </div>

  <!-- FIXED SCRIPT PATH -->
  <script type="module" src="src/firebase/auth.js"></script>
</body>
</html>
